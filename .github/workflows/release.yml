# 推送版本标签（如 12.1.1）后，自动打包并上传到 CurseForge。
# 需要先在仓库 Settings → Secrets and variables → Actions 里添加 CF_API_KEY。
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
